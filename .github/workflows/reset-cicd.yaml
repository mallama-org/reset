name: reset-cicd

on:
  push:
    paths:
      - src/**
    branches: [main]


permissions:
  contents: write

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Shorten commit id
        run: |
          echo "COMMIT_ID=${GITHUB_SHA::6}" >> "$GITHUB_ENV"
          
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
          
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: mallama/reset:${{ env.COMMIT_ID }}
          
    outputs:
      commit_id: ${{ env.COMMIT_ID }}

  cd:
    needs: ci
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.ACCESS_TOKEN_GITHUB }}
          
      - name: Install Python tools
        run: |
            sudo apt-get update
            sudo apt-get install -y python3-pip wget curl jq
            sudo ln -sf /usr/bin/python3 /usr/bin/python
            sudo ln -sf /usr/bin/pip3 /usr/bin/pip
            sudo curl -L https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -o yq
            sudo chmod +x yq
            sudo mv yq /usr/local/bin/yq

      - name: Modify values file
        run: |
          echo "Updating with commit:  ${{needs.ci.outputs.commit_id}}"
          yq -i '.image.tag = "${{needs.ci.outputs.commit_id}}"' charts/reset/values-prod.yaml

      - name: Commit changes
        uses: EndBug/add-and-commit@v9
        with:
          message: "Updated values.yaml with commit ${{needs.ci.outputs.commit_id}}"
          author_name: 'GitHub Actions'
          author_email: 'actions@github.com'
          pull: '--rebase --autostash'  # Add this line
          push: true
          # Remove github_token if permissions are set at workflow level

      - name: Install argocd
        run: |
          curl -ksSL -o argocd https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
          chmod +x argocd
          sudo mv ./argocd /usr/local/bin/argocd

      - name: Argocd login
        shell: bash
        run: |
          argocd login argocd-server.argocd \
            --insecure \
            --grpc-web \
            --username admin \
            --password ${{ secrets.ARGOCD_PASSWORD }}

      - name: Ensure argocd repo and app
        shell: bash
        run: |

          # Connects the argocd repo
          repo="https://github.com/mallama-org/reset.git"
          argocd repo list | grep -q $repo || argocd repo add $repo

          # Creates the argocd app
          argocd app get reset || argocd app create reset \
            --repo $repo \
            --path charts/reset \
            --dest-namespace prod \
            --dest-server https://kubernetes.default.svc \
            --values values-prod.yaml \
            --revision main \
            --sync-policy manual \
            --sync-option CreateNamespace=true

      - name: Argocd app sync
        shell: bash
        run: |
          argocd app sync reset
          argocd app wait reset --timeout 180